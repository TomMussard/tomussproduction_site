<style>
  /* ── PAGE HEAD ── */
  .page-head {
    padding: 160px var(--gutter) 60px;
    display: grid;
    grid-template-columns: 1.4fr 1fr;
    gap: 80px;
    align-items: end;
    border-bottom: 1px solid var(--line);
  }
  .page-head h1 {
    font-family: var(--f-display);
    font-size: clamp(72px, 13vw, 220px);
    line-height: .84;
    text-transform: uppercase;
  }
  .page-head h1 em { color: var(--accent); font-style: italic; font-weight: 400; }
  .page-head .right p {
    color: var(--fg-dim);
    font-size: 18px;
    line-height: 1.6;
    max-width: 420px;
    margin-bottom: 18px;
  }
  .page-head .meta {
    display: flex; gap: 28px;
    border-top: 1px solid var(--line);
    padding-top: 16px;
    font-family: var(--f-mono);
    font-size: 11px;
    letter-spacing: .22em;
    text-transform: uppercase;
    color: var(--fg-dim);
  }

  /* ── FILTER TABS ── */
  .filter-bar {
    padding: 36px var(--gutter) 0;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    border-bottom: 1px solid var(--line);
  }
  .filter-btn {
    font-family: var(--f-mono);
    font-size: 11px;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: var(--fg-dim);
    background: none;
    border: 1px solid var(--line-strong);
    padding: 8px 18px;
    cursor: pointer;
    transition: color .2s, border-color .2s, background .2s;
    margin-bottom: -1px;
  }
  .filter-btn:hover {
    color: var(--fg);
    border-color: var(--fg-dim);
  }
  .filter-btn.active {
    color: var(--accent);
    border-color: var(--accent);
    background: rgba(31,165,255,.06);
  }

  /* ── ACTU GRID ── */
  .actus-section {
    padding: 60px var(--gutter) 0;
  }
  .actus-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 2px;
  }

  /* ── ACTU CARD ── */
  .actus-card {
    background: var(--surface);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transition: background .22s;
    text-decoration: none;
    color: inherit;
  }
  .actus-card:hover { background: #222; }
  .actus-card:hover .card-arrow { transform: translate(3px, -3px); }

  .card-thumb {
    aspect-ratio: 16/9;
    overflow: hidden;
    background: #111;
    position: relative;
  }
  .card-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform .4s var(--ease);
  }
  .actus-card:hover .card-thumb img { transform: scale(1.04); }

  .card-thumb-placeholder {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--f-mono);
    font-size: 11px;
    letter-spacing: .18em;
    color: var(--fg-faint);
    text-transform: uppercase;
  }

  .card-badge {
    position: absolute;
    top: 12px;
    left: 12px;
    font-family: var(--f-mono);
    font-size: 11px;
    letter-spacing: .18em;
    text-transform: uppercase;
    padding: 4px 10px;
    background: var(--bg);
    color: var(--accent);
    border: 1px solid var(--accent-dim);
  }

  .card-body {
    padding: 20px 24px 24px;
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .card-meta {
    font-family: var(--f-mono);
    font-size: 11px;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--fg-faint);
    display: flex;
    gap: 16px;
  }

  .card-title {
    font-family: var(--f-body);
    font-size: 18px;
    font-weight: 500;
    line-height: 1.3;
    color: var(--fg);
    flex: 1;
  }

  .card-excerpt {
    font-size: 14px;
    color: var(--fg-dim);
    line-height: 1.55;
  }

  .card-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 8px;
  }

  .card-source {
    font-family: var(--f-mono);
    font-size: 11px;
    letter-spacing: .15em;
    text-transform: uppercase;
    color: var(--fg-faint);
  }

  .card-arrow {
    font-size: 16px;
    color: var(--accent);
    transition: transform .22s var(--ease);
  }

  /* ── EMPTY STATE ── */
  .actus-empty {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 80px 0;
    gap: 16px;
    text-align: center;
  }
  .actus-empty.visible { display: flex; }
  .actus-empty .empty-icon {
    font-size: 48px;
    opacity: .3;
  }
  .actus-empty p {
    font-family: var(--f-mono);
    font-size: 12px;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: var(--fg-faint);
  }

  /* ── SECTION LABEL ── */
  .section-divider {
    padding: 48px var(--gutter) 24px;
    display: flex;
    align-items: center;
    gap: 24px;
  }
  .section-divider span {
    font-family: var(--f-mono);
    font-size: 11px;
    letter-spacing: .28em;
    text-transform: uppercase;
    color: var(--fg-faint);
    white-space: nowrap;
  }
  .section-divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--line);
  }

  /* ── SUBMIT CTA ── */
  .actus-submit {
    margin: 80px var(--gutter) 0;
    padding: 48px;
    border: 1px solid var(--line-strong);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 40px;
    flex-wrap: wrap;
  }
  .actus-submit h3 {
    font-family: var(--f-display);
    font-size: clamp(28px, 4vw, 52px);
    line-height: .9;
    text-transform: uppercase;
  }
  .actus-submit p {
    color: var(--fg-dim);
    font-size: 16px;
    line-height: 1.5;
    max-width: 380px;
  }
  .actus-submit-left { display: flex; flex-direction: column; gap: 16px; }
  .actus-submit a.cta-btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-family: var(--f-mono);
    font-size: 12px;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: var(--bg);
    background: var(--fg);
    padding: 14px 28px;
    text-decoration: none;
    transition: background .22s, color .22s;
    white-space: nowrap;
    align-self: flex-start;
  }
  .actus-submit a.cta-btn:hover { background: var(--accent); color: #fff; }

  /* ── RESPONSIVE ── */
  @media (max-width: 1100px) {
    .actus-grid { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 800px) {
    .page-head {
      grid-template-columns: 1fr;
      gap: 40px;
      padding-top: 120px;
    }
    .actus-grid { grid-template-columns: 1fr; }
    .actus-submit { flex-direction: column; align-items: flex-start; }
  }
  @media (max-width: 480px) {
    .filter-bar { gap: 6px; }
    .filter-btn { font-size: 11px; padding: 6px 12px; }
  }
</style>
</head>
<body>

<div class="curtain"></div>

<!-- ── PAGE HEADER ── -->
<header class="page-head fade-up">
  <div class="left">
    <h1 class="wipe-in">ACTUS<em>.</em></h1>
  </div>
  <div class="right">
    <p>Mentions, collaborations, articles et vidéos, tout ce qui parle de Tomuss Production dans les médias et la communauté.</p>
    <div class="meta">
      <span>Presse & mentions</span>
      <span>Collaborations</span>
      <span>Actus</span>
    </div>
  </div>
</header>

<!-- ── FILTER BAR ── -->
<div class="filter-bar">
  <button class="filter-btn active" data-filter="all">Tout voir</button>
  <button class="filter-btn" data-filter="youtube">YouTube</button>
  <button class="filter-btn" data-filter="article">Presse</button>
</div>

<!-- ── ACTU GRID ── -->
<section class="actus-section">
  <div class="actus-grid" id="actus-grid"></div>
  <div class="actus-empty" id="actus-empty">
    <div class="empty-icon">◎</div>
    <p>Aucun contenu dans cette catégorie pour l'instant</p>
  </div>
</section>

<!-- SPACER -->
<div style="height: 100px;"></div>

<div id="footer-mount"></div>

<script src="assets/partials.js"></script>
<script src="assets/shared.js"></script>
<script>
  window.injectChrome('actus');

  /* ────────────────────────────────────────────────────────────────────────
     ACTU DATA
     Pour ajouter un article : copier un objet, remplir les champs, mettre
     à jour le compteur dans la page header si souhaité.
     type: 'youtube' | 'article' | 'collab' | 'mention'
  ──────────────────────────────────────────────────────────────────────── */
  const actus = [
    {
      type:    'youtube',
      title:   'Les Sarthois(es) du Web — Tom Mussard a créé son agence TomCom',
      source:  'YouTube — Les Sarthois(es) du Web',
      date:    '2025-05-09',
      excerpt: 'Portrait de Tom Mussard, vidéaste & monteur vidéo freelance au Mans et fondateur de TomCom — épisode 2 de la série "Les Sarthois(es) du Web".',
      thumb:   'https://img.youtube.com/vi/YD3aHUo1nYQ/maxresdefault.jpg',
      url:     'https://www.youtube.com/watch?v=YD3aHUo1nYQ&t=4s',
    },
    {
      type:    'article',
      title:   'À 21 ans, très investi dans sa commune, il y a créé sa petite entreprise',
      source:  'Ouest-France',
      date:    '2023-11-15',
      excerpt: 'Portrait de Tom Mussard, jeune entrepreneur d\'Arnage qui a lancé son activité de vidéaste & monteur vidéo freelance à seulement 21 ans, tout en restant très impliqué dans sa commune.',
      thumb:       'uploads/actu.avif',
      imgPosition: 'center',
      url:         'https://www.ouest-france.fr/pays-de-la-loire/arnage-72230/a-21-ans-tres-investi-dans-sa-commune-il-y-a-cree-sa-petite-entreprise-01cafb1e-83ab-11ee-8296-03c5fa435670',
    },
  ];

  /* ── BADGE LABELS ── */
  const badgeLabel = {
    youtube: 'YouTube',
    article: 'Article',
    collab:  'Collaboration',
    mention: 'Mention',
  };

  /* ── DATE FORMAT ── */
  function formatDate(iso) {
    if (!iso) return '';
    const d = new Date(iso + 'T00:00:00');
    return d.toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' });
  }

  /* ── RENDER CARD ── */
  function renderCard(a) {
    const pos = a.imgPosition ? ` style="object-position:${a.imgPosition}"` : '';
    const thumb = a.thumb
      ? `<img src="${a.thumb}" alt="${a.title}" loading="lazy"${pos} />`
      : `<div class="card-thumb-placeholder">Aucune image</div>`;
    return `
      <a class="actus-card fade-up" href="${a.url || '#'}" target="${a.url && a.url !== '#' ? '_blank' : '_self'}" rel="noopener" data-type="${a.type}">
        <div class="card-thumb">
          ${thumb}
          <span class="card-badge">${badgeLabel[a.type] || a.type}</span>
        </div>
        <div class="card-body">
          <div class="card-meta">
            <span>${formatDate(a.date)}</span>
          </div>
          <div class="card-title">${a.title}</div>
          ${a.excerpt ? `<div class="card-excerpt">${a.excerpt}</div>` : ''}
          <div class="card-footer">
            <span class="card-source">${a.source}</span>
            <span class="card-arrow">↗</span>
          </div>
        </div>
      </a>`;
  }

  /* ── FILTER LOGIC ── */
  let currentFilter = 'all';
  const grid  = document.getElementById('actus-grid');
  const empty = document.getElementById('actus-empty');

  /* ── FADE-UP OBSERVER (for dynamically rendered cards) ── */
  function observeFadeUps() {
    const obs = new IntersectionObserver((entries) => {
      entries.forEach(e => {
        if (e.isIntersecting) { e.target.classList.add('in'); obs.unobserve(e.target); }
      });
    }, { threshold: 0.08 });
    document.querySelectorAll('.fade-up:not(.in)').forEach(el => obs.observe(el));
  }

  function renderGrid(filter) {
    const items = filter === 'all' ? actus : actus.filter(a => a.type === filter);
    if (items.length === 0) {
      grid.innerHTML  = '';
      grid.style.display = 'none';
      empty.classList.add('visible');
    } else {
      grid.innerHTML  = items.map(renderCard).join('');
      grid.style.display = '';
      empty.classList.remove('visible');
      observeFadeUps();
    }
  }

  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentFilter = btn.dataset.filter;
      renderGrid(currentFilter);
    });
  });

  renderGrid('all');
</script>
</body>
