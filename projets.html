<style>
  /* ── PAGE HEAD ── */
  .page-head {
    padding: 160px var(--gutter) 72px;
    border-bottom: 1px solid var(--line);
  }
  .page-head h1 {
    font-family: var(--f-display);
    font-size: clamp(72px, 13vw, 200px);
    line-height: .84;
    text-transform: uppercase;
  }
  .page-head h1 em { color: var(--accent); font-style: italic; }

  /* ── SECTION LABEL ── */
  .section-label {
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 48px var(--gutter) 40px;
    border-bottom: 1px solid var(--line);
  }
  .section-label .s-num {
    font-family: var(--f-mono);
    font-size: 11px;
    letter-spacing: .3em;
    color: var(--fg-faint);
  }
  .section-label .s-title {
    font-family: var(--f-display);
    font-size: clamp(28px, 4vw, 56px);
    text-transform: uppercase;
    color: var(--fg);
    line-height: 1;
  }
  .section-label .s-count {
    margin-left: auto;
    font-family: var(--f-mono);
    font-size: 11px;
    letter-spacing: .2em;
    color: var(--fg-faint);
  }

  /* ── GRILLE MONTAGE ── */
  .grid {
    padding: 48px var(--gutter) 100px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 48px 28px;
  }
  .thumb {
    display: block;
    text-decoration: none;
    color: var(--fg);
  }
  .thumb-frame {
    position: relative;
    aspect-ratio: 16/9;
    background: var(--surface);
    overflow: hidden;
    border-radius: 4px;
    margin-bottom: 14px;
  }
  .thumb-frame img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
    transition: transform .6s var(--ease);
  }
  .thumb:hover .thumb-frame img { transform: scale(1.04); }
  .thumb.featured { grid-column: span 2; }
  .thumb.featured .thumb-frame { aspect-ratio: 21/9; }
  .duration {
    position: absolute;
    bottom: 8px; right: 8px;
    font-family: var(--f-mono);
    font-size: 11px;
    background: rgba(0,0,0,.78);
    color: #fff;
    padding: 3px 7px;
    border-radius: 3px;
    letter-spacing: .05em;
  }
  .play {
    position: absolute;
    inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,0);
    transition: background .3s;
  }
  .play span {
    font-size: 36px;
    opacity: 0;
    transform: scale(.8);
    transition: opacity .3s, transform .3s;
  }
  .thumb:hover .play { background: rgba(0,0,0,.28); }
  .thumb:hover .play span { opacity: 1; transform: scale(1); }
  .thumb-meta {
    display: flex;
    gap: 12px;
    align-items: flex-start;
  }
  .avatar {
    width: 36px; height: 36px;
    border-radius: 50%;
    overflow: hidden;
    flex-shrink: 0;
    background: var(--surface);
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .info h3 {
    font-family: var(--f-sans);
    font-size: 14px;
    font-weight: 500;
    line-height: 1.4;
    margin-bottom: 4px;
    color: var(--fg);
  }
  .info p {
    font-family: var(--f-mono);
    font-size: 11px;
    color: var(--fg-dim);
    letter-spacing: .05em;
  }
  .sep { margin: 0 6px; opacity: .4; }

  /* ── SHORTS & REELS ── */
  .shorts-wrap {
    padding: 60px var(--gutter) 100px;
  }
  .shorts-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 24px;
  }
  .short-card {
    display: block;
    text-decoration: none;
    color: var(--fg);
  }
  .short-frame {
    position: relative;
    aspect-ratio: 9/16;
    background: var(--surface);
    overflow: hidden;
    border-radius: 4px;
    margin-bottom: 12px;
  }
  .short-frame img,
  .short-frame video {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
    transition: transform .6s var(--ease);
  }
  .short-card:hover .short-frame img,
  .short-card:hover .short-frame video { transform: scale(1.04); }
  .short-frame .play {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,0);
    transition: background .3s;
  }
  .short-frame .play span { font-size: 32px; opacity: 0; transform: scale(.8); transition: opacity .3s, transform .3s; }
  .short-card:hover .short-frame .play { background: rgba(0,0,0,.28); }
  .short-card:hover .short-frame .play span { opacity: 1; transform: scale(1); }
  .short-info h3 {
    font-family: var(--f-sans);
    font-size: 13px;
    font-weight: 500;
    line-height: 1.4;
    margin-bottom: 4px;
  }
  .short-info p {
    font-family: var(--f-mono);
    font-size: 11px;
    color: var(--fg-dim);
    letter-spacing: .05em;
  }
  /* Placeholder "bientôt" */
  .shorts-soon {
    padding: 60px var(--gutter) 100px;
    display: flex;
    align-items: center;
    gap: 32px;
  }
  .soon-rule { flex: 1; height: 1px; background: var(--line); }
  .soon-label {
    font-family: var(--f-mono);
    font-size: 11px;
    letter-spacing: .3em;
    text-transform: uppercase;
    color: var(--fg-faint);
    white-space: nowrap;
  }

  /* ── PHOTOS PAR ÉVÉNEMENT ── */
  .photos-wrap {
    padding: 48px 0 100px;
  }
  .event-block {
    border-top: 1px solid var(--line);
  }
  .event-block-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 24px;
    padding: 32px var(--gutter);
    cursor: pointer;
    user-select: none;
  }
  .event-block-head:hover .event-block-title { color: var(--accent); }
  .event-block-title {
    font-family: var(--f-display);
    font-size: clamp(28px, 4vw, 60px);
    text-transform: uppercase;
    line-height: 1;
    transition: color .2s;
  }
  .event-block-title em { color: var(--accent); font-style: italic; }
  .event-block-meta {
    font-family: var(--f-mono);
    font-size: 11px;
    letter-spacing: .2em;
    color: var(--fg-faint);
    display: flex;
    align-items: center;
    gap: 16px;
    flex-shrink: 0;
  }
  .event-toggle {
    font-size: 18px;
    transition: transform .3s;
    display: inline-block;
  }
  .event-block.open .event-toggle { transform: rotate(45deg); }
  .event-block-body {
    overflow: hidden;
    max-height: 0;
    transition: max-height .6s cubic-bezier(.22,1,.36,1);
  }
  .event-block.open .event-block-body { max-height: 4000px; }
  .event-soon-body {
    padding: 0 var(--gutter) 40px;
  }
  .event-soon-pill {
    display: inline-block;
    font-family: var(--f-mono);
    font-size: 11px;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: var(--fg-faint);
    border: 1px solid var(--line);
    padding: 8px 20px;
    border-radius: 100px;
  }
  .photo-masonry {
    columns: 3;
    column-gap: 16px;
    padding: 0 var(--gutter) 48px;
  }
  .photo-item {
    break-inside: avoid;
    margin-bottom: 16px;
    position: relative;
    overflow: hidden;
    border-radius: 4px;
    cursor: pointer;
  }
  .photo-item img {
    width: 100%;
    display: block;
    transition: transform .5s var(--ease);
  }
  .photo-item:hover img { transform: scale(1.03); }
  .photo-overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,.35);
    display: flex;
    align-items: flex-end;
    padding: 16px;
    opacity: 0;
    transition: opacity .3s;
  }
  .photo-item:hover .photo-overlay { opacity: 1; }
  .photo-overlay span {
    font-family: var(--f-mono);
    font-size: 11px;
    letter-spacing: .2em;
    color: #fff;
  }

  /* ── LIGHTBOX ── */
  .lightbox {
    display: none;
    position: fixed; inset: 0; z-index: 9000;
    background: rgba(0,0,0,.94);
    align-items: center; justify-content: center;
  }
  .lightbox.open { display: flex; }
  .lb-img {
    max-width: 90vw; max-height: 88vh;
    object-fit: contain;
    border-radius: 4px;
  }
  .lb-close {
    position: absolute; top: 20px; right: 24px;
    background: none; border: none; color: #fff;
    font-size: 28px; cursor: pointer; opacity: .7;
    transition: opacity .2s;
  }
  .lb-close:hover { opacity: 1; }
  .lb-prev, .lb-next {
    position: absolute; top: 50%; transform: translateY(-50%);
    background: rgba(255,255,255,.08); border: none; color: #fff;
    font-size: 24px; padding: 16px 20px; cursor: pointer;
    transition: background .2s; border-radius: 4px;
  }
  .lb-prev { left: 16px; }
  .lb-next { right: 16px; }
  .lb-prev:hover, .lb-next:hover { background: rgba(255,255,255,.18); }
  .lb-counter {
    position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
    font-family: var(--f-mono); font-size: 11px; letter-spacing: .2em;
    color: rgba(255,255,255,.5);
  }

  /* ── BOTTOM CTA ── */
  .bottom-cta {
    padding: 120px var(--gutter);
    border-top: 1px solid var(--line);
    text-align: center;
  }
  .bottom-cta h2 {
    font-family: var(--f-display);
    font-size: clamp(48px, 9vw, 140px);
    text-transform: uppercase;
    line-height: .88;
    margin-bottom: 48px;
  }
  .bottom-cta h2 em { color: var(--accent); font-style: italic; }

  /* ── RESPONSIVE ── */
  @media (max-width: 1024px) {
    .grid { grid-template-columns: repeat(2, 1fr); }
    .thumb.featured { grid-column: span 2; }
    .shorts-grid { grid-template-columns: repeat(3, 1fr); }
  }
  @media (max-width: 880px) {
    .page-head { padding: 120px var(--gutter) 48px; }
    .grid { grid-template-columns: 1fr 1fr; gap: 32px 16px; }
    .shorts-grid { grid-template-columns: repeat(2, 1fr); }
    .photo-masonry { columns: 2; }
  }
  @media (max-width: 640px) {
    .grid { grid-template-columns: 1fr; }
    .thumb.featured { grid-column: span 1; }
    .thumb.featured .thumb-frame { aspect-ratio: 16/9; }
    .shorts-grid { grid-template-columns: repeat(2, 1fr); }
    .photo-masonry { columns: 1; }
    .lb-prev, .lb-next { padding: 10px 12px; font-size: 18px; }
  }
</style>

<script>
  window.injectChrome('projects');

  /* ══════════════════════════════════════
     01 — MONTAGE (YouTube API + fallback)
     Pour changer les vidéos : modifie fallbackProjects
  ══════════════════════════════════════ */
  const CONFIG = {
    apiKey: 'AIzaSyDrxvyFZJhjZauXxcs4bU11xs3mAzeaL8M',
    playlistId: 'PL00Z1aG7rYtiV35v_4hWYZpzRZ18TuLqA',
    maxVideos: 24
  };

  const fallbackProjects = [
    { idx: 1, feat: true,
      title: 'QUI EST LE JOUEUR PRO ?! (ft. Gradur & Redouane Bougheraba)',
      creator: 'Pitch Addict', views: '552 k', date: 'Mai 2026', dur: '—',
      thumbnail: 'uploads/miniadvlp.jpg', avatar: 'uploads/channels4_profile.png',
      url: 'https://youtu.be/r0zvh0ElcnM' },
    { idx: 2,
      title: 'LE MEILLEUR BARBER D\'INTERNET ! (ft Inoxtag Joyca Nico & Cocotte)',
      creator: 'Hairtist', views: '552 k', date: 'Août 2025', dur: '—',
      thumbnail: 'uploads/maxresdefault (1).jpg', avatar: 'uploads/unnamed.jpg',
      url: 'https://youtu.be/UqYMpBAAEA8' },
    { idx: 3,
      title: 'J\'ai acheté 10 VALISES PERDUES (c\'est trop RENTABLE)',
      creator: 'Camille LV', views: '766 k', date: 'Févr. 2024', dur: '—',
      thumbnail: 'uploads/maxresdefault (2).jpg', avatar: 'uploads/channels4_profile (2).jpg',
      url: 'https://youtu.be/-YiWp9Usmr0' },
    { idx: 4,
      title: 'On goûte les 20 aliments préférés des français',
      creator: 'Pierre Croce', views: '135 k', date: 'Nov. 2025', dur: '—',
      thumbnail: 'uploads/maxresdefault (3).jpg', avatar: 'uploads/channels4_profile (3).jpg',
      url: 'https://youtu.be/Tnw8BUV8Y8s' },
    { idx: 5,
      title: 'CACHE CACHE DANS UNE BIBLIOTHÈQUE (MAIS fais pas de bruit)',
      creator: 'Guizzi', views: '532 k', date: 'Sept. 2024', dur: '—',
      thumbnail: 'uploads/maxresdefault (4).jpg', avatar: 'uploads/channels4_profile (4).jpg',
      url: 'https://youtu.be/F77U_yuUb5s' },
    { idx: 6,
      title: 'MATHIS DUMAS ME DÉVOILE LES SECRETS DE L\'EVEREST AVEC INOXTAG !',
      creator: 'Hairtist', views: '610 k', date: 'Sept. 2024', dur: '—',
      thumbnail: 'uploads/maxresdefault (5).jpg', avatar: 'uploads/unnamed.jpg',
      url: 'https://youtu.be/es62U2hFlA4' }
  ];

  function fmtViews(n) {
    if (n >= 1e6) return (n / 1e6).toFixed(1).replace('.', ',') + ' M';
    if (n >= 1e3) return Math.round(n / 1e3) + ' k';
    return String(n);
  }
  function fmtDuration(iso) {
    const m = iso.match(/PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/) || [];
    const h = +m[1] || 0, min = +m[2] || 0, sec = +m[3] || 0;
    const pad = v => String(v).padStart(2, '0');
    return h ? `${h}:${pad(min)}:${pad(sec)}` : `${min}:${pad(sec)}`;
  }
  function fmtDate(str) {
    const days = Math.floor((Date.now() - new Date(str)) / 86400000);
    if (days < 30) return 'ce mois-ci';
    const months = Math.floor(days / 30);
    if (months < 12) return `il y a ${months} mois`;
    const years = Math.floor(months / 12);
    return `il y a ${years} an${years > 1 ? 's' : ''}`;
  }

  function makeCard(p) {
    const thumb = p.thumbnail
      ? `<img src="${p.thumbnail}" alt="${p.title}" loading="lazy" />`
      : `<span style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--f-mono);font-size:11px;color:var(--fg-faint);">[ ${String(p.idx).padStart(2,'0')} ]</span>`;
    return `
      <a class="thumb ${p.feat ? 'featured' : ''} fade-up" href="${p.url}" target="_blank" rel="noopener">
        <div class="thumb-frame">
          ${thumb}
          <span class="duration">${p.dur || '—'}</span>
          <div class="play"><span>▶</span></div>
        </div>
        <div class="thumb-meta">
          <div class="avatar">${p.avatar ? `<img src="${p.avatar}" alt="${p.creator}" />` : ''}</div>
          <div class="info">
            <h3>${p.title}</h3>
            <p>${p.creator}${p.views && p.views !== '—' ? `<span class="sep">·</span>${p.views} vues` : ''}<span class="sep">·</span>${p.date}</p>
          </div>
        </div>
      </a>`;
  }

  const grid = document.getElementById('grid');
  const countMontage = document.getElementById('count-montage');

  function renderProjects(projects) {
    grid.innerHTML = projects.map(makeCard).join('');
    countMontage.textContent = projects.length + ' vidéos';
  }

  async function fetchPlaylist() {
    const base = 'https://www.googleapis.com/youtube/v3';
    const plRes = await fetch(`${base}/playlistItems?part=snippet&playlistId=${CONFIG.playlistId}&maxResults=50&key=${CONFIG.apiKey}`);
    if (!plRes.ok) throw new Error('playlist ' + plRes.status);
    const plData = await plRes.json();
    const items = (plData.items || [])
      .filter(i => i.snippet.resourceId?.kind === 'youtube#video')
      .sort((a, b) => new Date(b.snippet.publishedAt) - new Date(a.snippet.publishedAt))
      .slice(0, CONFIG.maxVideos);
    if (!items.length) throw new Error('vide');
    const channelIds = [...new Set(items.map(i => i.snippet.videoOwnerChannelId).filter(Boolean))];
    let avatars = {};
    if (channelIds.length) {
      const chRes = await fetch(`${base}/channels?part=snippet&id=${channelIds.join(',')}&key=${CONFIG.apiKey}`);
      if (chRes.ok) {
        const chData = await chRes.json();
        avatars = Object.fromEntries((chData.items || []).map(c => [c.id, c.snippet.thumbnails?.default?.url || '']));
      }
    }
    const ids = items.map(i => i.snippet.resourceId.videoId).join(',');
    const vRes = await fetch(`${base}/videos?part=snippet,statistics,contentDetails&id=${ids}&key=${CONFIG.apiKey}`);
    if (!vRes.ok) throw new Error('videos ' + vRes.status);
    const vData = await vRes.json();
    const statsMap = Object.fromEntries((vData.items || []).map(v => [v.id, v]));
    return items.map((item, i) => {
      const vid = item.snippet.resourceId.videoId;
      const extra = statsMap[vid] || {};
      const thumbs = extra.snippet?.thumbnails || item.snippet.thumbnails || {};
      return {
        idx: i + 1, feat: i === 0,
        title: item.snippet.title,
        creator: item.snippet.videoOwnerChannelTitle || '',
        views: fmtViews(+(extra.statistics?.viewCount || 0)),
        dur: extra.contentDetails ? fmtDuration(extra.contentDetails.duration) : '—',
        date: fmtDate(item.snippet.publishedAt),
        thumbnail: (thumbs.maxres || thumbs.high || thumbs.medium || thumbs.default)?.url || '',
        avatar: avatars[item.snippet.videoOwnerChannelId] || '',
        url: `https://youtu.be/${vid}`
      };
    });
  }

  fetchPlaylist()
    .then(api => {
      const apiUrls = new Set(api.map(p => p.url));
      const extra = fallbackProjects.filter(p => !apiUrls.has(p.url)).map((p, i) => ({...p, idx: api.length+i+1, feat: false}));
      renderProjects([...api, ...extra]);
    })
    .catch(() => renderProjects(fallbackProjects));

  /* ══════════════════════════════════════
     02 — SHORTS & REELS
     Pour ajouter un clip : ajoute un objet dans shorts[]
     youtube: 'ID'  ou  src: 'uploads/...'
  ══════════════════════════════════════ */
  const shorts = [
    /* Exemple Manchester City (décommenter et remplacer l'URL) :
    {
      youtube: 'YOUTUBE_SHORT_ID',
      title: 'Manchester City — Reel',
      creator: 'Manchester City',
      date: '2025'
    },
    */
  ];

  const shortsContainer = document.getElementById('shorts-container');
  const countShorts = document.getElementById('count-shorts');

  if (shorts.length === 0) {
    shortsContainer.innerHTML = `
      <div style="padding:48px var(--gutter) 80px; display:flex; align-items:center; gap:32px;">
        <span style="flex:1; height:1px; background:var(--line);"></span>
        <span style="font-family:var(--f-mono); font-size:11px; letter-spacing:.3em; text-transform:uppercase; color:var(--fg-faint);">Clips à venir</span>
        <span style="flex:1; height:1px; background:var(--line);"></span>
      </div>`;
    countShorts.textContent = 'bientôt';
  } else {
    countShorts.textContent = shorts.length + ' clips';
    shortsContainer.innerHTML = `<div class="shorts-wrap"><div class="shorts-grid">${
      shorts.map(s => {
        const media = s.youtube
          ? `<img src="https://img.youtube.com/vi/${s.youtube}/mqdefault.jpg" alt="${s.title}" loading="lazy">`
          : `<img src="${s.thumbnail || ''}" alt="${s.title}" loading="lazy">`;
        const href = s.youtube ? `https://youtu.be/${s.youtube}` : (s.url || '#');
        return `
          <a class="short-card fade-up" href="${href}" target="_blank" rel="noopener">
            <div class="short-frame">
              ${media}
              <div class="play"><span>▶</span></div>
            </div>
            <div class="short-info">
              <h3>${s.title}</h3>
              <p>${s.creator}<span class="sep">·</span>${s.date}</p>
            </div>
          </a>`;
      }).join('')
    }</div></div>`;
  }

  /* ══════════════════════════════════════
     03 — PHOTOS par événement
     Pour ajouter un événement : crée un nouveau block dans le HTML
     et ajoute les photos dans le tableau correspondant
  ══════════════════════════════════════ */
  const photos24h2025 = [
    { src: 'uploads/PHOTO/DSC03270.jpg',    caption: '24H du Mans 2025' },
    { src: 'uploads/PHOTO/DSC04947.jpeg',   caption: '24H du Mans 2025' },
    { src: 'uploads/PHOTO/DSC05020.jpeg',   caption: '24H du Mans 2025' },
    { src: 'uploads/PHOTO/DSC05054.jpeg',   caption: '24H du Mans 2025' },
    { src: 'uploads/PHOTO/DSC05080.jpeg',   caption: '24H du Mans 2025' },
    { src: 'uploads/PHOTO/DSC05088.jpeg',   caption: '24H du Mans 2025' },
    { src: 'uploads/PHOTO/DSC05115.jpeg',   caption: '24H du Mans 2025' },
    { src: 'uploads/PHOTO/DSC05399.jpeg',   caption: '24H du Mans 2025' },
    { src: 'uploads/PHOTO/DSC07198.jpeg',   caption: '24H du Mans 2025' },
    { src: 'uploads/PHOTO/DSC07207.jpeg',   caption: '24H du Mans 2025' },
    { src: 'uploads/PHOTO/DSC07222.jpeg',   caption: '24H du Mans 2025' },
    { src: 'uploads/PHOTO/DSC07248.jpeg',   caption: '24H du Mans 2025' },
    { src: 'uploads/PHOTO/IMG_1746.jpeg',   caption: '24H du Mans 2025' },
    { src: 'uploads/PHOTO/IMG_1753.jpeg',   caption: '24H du Mans 2025' },
    { src: 'uploads/PHOTO/IMG_1760.jpeg',   caption: '24H du Mans 2025' },
    { src: 'uploads/PHOTO/IMG_1761.jpeg',   caption: '24H du Mans 2025' },
    { src: 'uploads/PHOTO/IMG_1763.jpeg',   caption: '24H du Mans 2025' },
    { src: 'uploads/PHOTO/IMG_1769 2.jpeg', caption: '24H du Mans 2025' },
  ];

  /* Lightbox state — toutes les photos actives dans l'événement ouvert */
  let lbPhotos = [];
  let lbIdx = 0;
  const lightbox = document.getElementById('lightbox');
  const lbImg    = document.getElementById('lb-img');
  const lbCount  = document.getElementById('lb-counter');

  function openLightbox(photos, idx) {
    lbPhotos = photos;
    lbIdx = ((idx % photos.length) + photos.length) % photos.length;
    lbImg.src = photos[lbIdx].src;
    lbImg.alt = photos[lbIdx].caption;
    lbCount.textContent = `${lbIdx + 1} / ${photos.length}`;
    lightbox.classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  function closeLightbox() {
    lightbox.classList.remove('open');
    document.body.style.overflow = '';
  }
  function navLb(dir) {
    lbIdx = ((lbIdx + dir + lbPhotos.length) % lbPhotos.length);
    lbImg.src = lbPhotos[lbIdx].src;
    lbImg.alt = lbPhotos[lbIdx].caption;
    lbCount.textContent = `${lbIdx + 1} / ${lbPhotos.length}`;
  }

  document.getElementById('lb-close').addEventListener('click', closeLightbox);
  document.getElementById('lb-prev').addEventListener('click', () => navLb(-1));
  document.getElementById('lb-next').addEventListener('click', () => navLb(1));
  lightbox.addEventListener('click', e => { if (e.target === lightbox) closeLightbox(); });
  document.addEventListener('keydown', e => {
    if (!lightbox.classList.contains('open')) return;
    if (e.key === 'Escape')     closeLightbox();
    if (e.key === 'ArrowLeft')  navLb(-1);
    if (e.key === 'ArrowRight') navLb(1);
  });

  function renderMasonry(containerId, photos) {
    const el = document.getElementById(containerId);
    if (!el) return;
    el.innerHTML = photos.map((p, i) => `
      <div class="photo-item fade-up" data-idx="${i}" role="button" tabindex="0" aria-label="${p.caption}">
        <img src="${p.src}" alt="${p.caption}" loading="lazy" />
        <div class="photo-overlay"><span>Voir ⤢</span></div>
      </div>`).join('');
    el.querySelectorAll('.photo-item').forEach(item => {
      item.addEventListener('click', () => openLightbox(photos, +item.dataset.idx));
      item.addEventListener('keydown', e => { if (e.key === 'Enter') openLightbox(photos, +item.dataset.idx); });
    });
  }

  renderMasonry('masonry-24h-2025', photos24h2025);

  /* ── Accordéon événements ── */
  document.querySelectorAll('.event-block-head[data-block]').forEach(head => {
    const block = head.closest('.event-block');
    if (!block.querySelector('.event-block-body')) return; // section "bientôt" = pas de toggle
    head.style.cursor = 'pointer';
    head.addEventListener('click', () => {
      block.classList.toggle('open');
    });
  });
</script>
</body>
