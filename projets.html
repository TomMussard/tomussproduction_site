<style>
  /* ── PAGE HEAD ── */
  .page-head {
    padding: 160px var(--gutter) 56px;
    border-bottom: 1px solid var(--line);
  }
  .page-head h1 {
    font-family: var(--f-display);
    font-size: clamp(72px, 13vw, 200px);
    line-height: .84;
    text-transform: uppercase;
  }
  .page-head h1 em { color: var(--accent); font-style: italic; }

  /* ── TABS ── */
  .tabs {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    border-bottom: 1px solid var(--line);
  }
  .tab-btn {
    padding: 28px var(--gutter);
    font-family: var(--f-display);
    font-size: clamp(22px, 3vw, 44px);
    text-transform: uppercase;
    color: var(--fg-dim);
    border: none;
    border-right: 1px solid var(--line);
    background: none;
    cursor: pointer;
    text-align: left;
    display: flex;
    align-items: center;
    gap: 14px;
    transition: color .2s, background .2s;
    position: relative;
  }
  .tab-btn:last-child { border-right: none; }
  .tab-btn .tab-num {
    font-family: var(--f-mono);
    font-size: 11px;
    letter-spacing: .28em;
    color: var(--fg-faint);
  }
  .tab-btn .tab-count {
    margin-left: auto;
    font-family: var(--f-mono);
    font-size: 11px;
    color: var(--fg-faint);
  }
  .tab-btn:hover { color: var(--fg); background: var(--surface); }
  .tab-btn.active { color: var(--fg); }
  .tab-btn.active::after {
    content: '';
    position: absolute;
    bottom: -1px; left: 0; right: 0;
    height: 2px;
    background: var(--accent);
  }

  /* ── FILTER PILLS ── */
  .filters {
    display: flex;
    gap: 10px;
    padding: 24px var(--gutter);
    border-bottom: 1px solid var(--line);
    flex-wrap: wrap;
  }
  .pill-filter {
    font-family: var(--f-mono);
    font-size: 11px;
    letter-spacing: .18em;
    text-transform: uppercase;
    padding: 7px 18px;
    border-radius: 100px;
    border: 1px solid var(--line);
    background: none;
    color: var(--fg-dim);
    cursor: pointer;
    transition: all .2s;
  }
  .pill-filter:hover { border-color: var(--fg-faint); color: var(--fg); }
  .pill-filter.active { background: var(--fg); color: var(--bg); border-color: var(--fg); }

  /* ── TAB SECTIONS ── */
  .tab-section { display: none; }
  .tab-section.active { display: block; }

  /* ── GRILLE VIDÉOS ── */
  .video-section-header {
    padding: 56px var(--gutter) 20px;
    display: flex; align-items: baseline; gap: 20px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 24px;
  }
  .video-section-header:first-child { padding-top: 32px; }
  .video-section-label {
    font-family: var(--f-display);
    font-size: clamp(28px, 4vw, 52px);
    text-transform: uppercase;
    letter-spacing: .02em;
    color: var(--fg);
    line-height: 1;
  }
  .video-section-desc {
    font-family: var(--f-mono);
    font-size: 11px;
    letter-spacing: .12em;
    color: var(--fg-faint);
    text-transform: uppercase;
  }
  .video-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    padding: 0 var(--gutter) 16px;
  }
  .vcard {
    position: relative;
    text-decoration: none;
    color: var(--fg);
    overflow: hidden;
    display: block;
  }
  .vcard-frame {
    position: relative;
    aspect-ratio: 16/9;
    background: var(--surface);
    overflow: hidden;
    border-radius: 3px;
  }
  .vcard-frame img {
    width: 100%; height: 100%;
    object-fit: cover; display: block;
    transition: transform .7s var(--ease);
  }
  .vcard:hover .vcard-frame img { transform: scale(1.04); }
  /* Overlay hover */
  .vcard-overlay {
    position: absolute; inset: 0;
    background: linear-gradient(to top, rgba(0,0,0,.82) 0%, rgba(0,0,0,.12) 50%, transparent 100%);
    display: flex; flex-direction: column; justify-content: flex-end;
    padding: 16px;
    opacity: 0; transition: opacity .3s;
    text-decoration: none; border-radius: 3px;
  }
  .vcard:hover .vcard-overlay { opacity: 1; }
  .vcard-overlay-title {
    font-family: var(--f-sans);
    font-size: 13px; font-weight: 500; line-height: 1.35;
    color: #fff; margin-bottom: 5px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .vcard-overlay-meta {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    font-family: var(--f-mono); font-size: 10px; color: rgba(255,255,255,.55);
  }
  .vcard-overlay-views { color: var(--accent); font-weight: 600; }
  /* YouTube autoplay iframe */
  .vcard-iframe-wrap {
    position: absolute; inset: 0; pointer-events: none;
    opacity: 0; transition: opacity .5s;
    overflow: hidden; border-radius: 3px;
  }
  .vcard-iframe-wrap.playing { opacity: 1; }
  .vcard-iframe-wrap iframe { width: 100%; height: 100%; border: none; transform: scale(1.05); }
  /* Infos sous la carte */
  .vcard-below {
    padding: 10px 0 0;
    display: flex; align-items: center; gap: 8px;
  }
  .vcard-below-name { font-family: var(--f-mono); font-size: 11px; color: var(--fg-faint); }
  .vcard-below-sep  { font-family: var(--f-mono); font-size: 10px; color: var(--fg-faint); opacity: .3; }
  .vcard-below-date { font-family: var(--f-mono); font-size: 11px; color: var(--fg-faint); }
  .sep { margin: 0 6px; opacity: .4; }
  .video-empty { padding: 80px var(--gutter); text-align: center; color: var(--fg-faint); font-family: var(--f-mono); font-size: 13px; letter-spacing: .1em; }

  /* ── GRILLE SHORTS ── */
  .shorts-grid {
    padding: 48px var(--gutter) 100px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 24px;
  }
  .scard { display: block; text-decoration: none; color: var(--fg); }
  .scard-frame {
    position: relative; aspect-ratio: 9/16;
    background: var(--surface); overflow: hidden; border-radius: 4px; margin-bottom: 12px;
  }
  .scard-frame img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .6s var(--ease); }
  .scard:hover .scard-frame img { transform: scale(1.04); }
  .scard-play {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,0); transition: background .3s;
  }
  .scard-play span { font-size: 28px; opacity: 0; transform: scale(.8); transition: opacity .3s, transform .3s; }
  .scard:hover .scard-play { background: rgba(0,0,0,.28); }
  .scard:hover .scard-play span { opacity: 1; transform: scale(1); }
  .scard-info h3 { font-family: var(--f-body); font-size: 13px; font-weight: 500; line-height: 1.4; margin-bottom: 4px; }
  .scard-info p { font-family: var(--f-mono); font-size: 11px; color: var(--fg-dim); }
  /* Instagram reel card */
  .scard-ig .scard-frame {
    background: radial-gradient(ellipse at 50% 30%, #1a1a1a 0%, #0a0a0a 100%);
    border: 1px solid rgba(244,239,230,.08);
  }
  .scard-ig .scard-frame::before {
    content: '';
    position: absolute; inset: 0;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(244,239,230,.012) 2px, rgba(244,239,230,.012) 4px);
    pointer-events: none;
  }
  .scard-ig-inner {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
    transition: opacity .25s;
  }
  .scard-ig-inner span { font-family: var(--f-mono); font-size: 10px; letter-spacing: .2em; color: rgba(244,239,230,.35); text-transform: uppercase; }
  .scard-ig:hover .scard-ig-inner { opacity: .6; }
  .scard-ig:hover .scard-frame { border-color: rgba(244,239,230,.18); }
  /* IG card with thumbnail */
  .scard-ig .scard-frame img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .6s var(--ease); }
  .scard-ig:hover .scard-frame img { transform: scale(1.04); }
  .scard-ig .scard-ig-badge {
    position: absolute; bottom: 10px; right: 10px;
    background: rgba(0,0,0,.55); backdrop-filter: blur(6px);
    border: 1px solid rgba(244,239,230,.15); border-radius: 4px;
    padding: 5px 8px; display: flex; align-items: center; gap: 6px;
  }
  .scard-ig .scard-ig-badge span { font-family: var(--f-mono); font-size: 10px; letter-spacing: .15em; color: rgba(244,239,230,.7); text-transform: uppercase; }
  .shorts-soon {
    padding: 72px var(--gutter) 100px;
    display: flex; align-items: center; gap: 32px;
  }
  .shorts-soon-rule { flex: 1; height: 1px; background: var(--line); }
  .shorts-soon-label { font-family: var(--f-mono); font-size: 11px; letter-spacing: .3em; text-transform: uppercase; color: var(--fg-faint); white-space: nowrap; }

  /* ── PHOTOS PAR ÉVÉNEMENT ── */
  .photos-wrap { padding: 0 0 80px; }
  /* Sélecteur d'événement */
  .event-selector {
    display: flex; gap: 0; border-bottom: 1px solid var(--line);
    overflow-x: auto; scrollbar-width: none;
  }
  .event-selector::-webkit-scrollbar { display: none; }
  .event-pill {
    flex-shrink: 0;
    padding: 20px 28px;
    font-family: var(--f-display); font-size: clamp(16px, 2vw, 24px);
    text-transform: uppercase; letter-spacing: .04em;
    background: none; border: none; border-right: 1px solid var(--line);
    color: var(--fg-faint); cursor: pointer;
    transition: color .2s, background .2s;
    white-space: nowrap;
  }
  .event-pill:hover { color: var(--fg); }
  .event-pill.active { color: var(--fg); background: rgba(244,239,230,.04); }
  .event-pill.active::after {
    content: ''; display: block; height: 2px;
    background: var(--accent); margin-top: 6px;
  }
  .event-pill .pill-count { font-family: var(--f-mono); font-size: 11px; color: var(--fg-faint); margin-left: 8px; }
  .event-pill.soon-event { opacity: .4; cursor: default; }
  /* Grille masonry */
  .photo-masonry { columns: 6; column-gap: 8px; padding: 24px var(--gutter) 48px; }
  .photo-item { break-inside: avoid; margin-bottom: 10px; position: relative; overflow: hidden; border-radius: 3px; cursor: pointer; }
  .photo-item img { width: 100%; display: block; transition: transform .5s var(--ease); }
  .photo-item:hover img { transform: scale(1.03); }
  .photo-overlay { position: absolute; inset: 0; background: rgba(0,0,0,.35); display: flex; align-items: flex-end; padding: 14px; opacity: 0; transition: opacity .3s; }
  .photo-item:hover .photo-overlay { opacity: 1; }
  .photo-overlay span { font-family: var(--f-mono); font-size: 11px; letter-spacing: .2em; color: #fff; }
  .soon-pill { font-family: var(--f-mono); font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--fg-faint); border: 1px solid var(--line); padding: 6px 16px; border-radius: 100px; }

  /* ── LIGHTBOX ── */
  .lightbox { display: none; position: fixed; inset: 0; z-index: 9000; background: rgba(0,0,0,.94); align-items: center; justify-content: center; }
  .lightbox.open { display: flex; }
  .lb-img { max-width: 90vw; max-height: 88vh; object-fit: contain; border-radius: 4px; }
  .lb-close { position: absolute; top: 20px; right: 24px; background: none; border: none; color: #fff; font-size: 28px; cursor: pointer; opacity: .7; transition: opacity .2s; }
  .lb-close:hover { opacity: 1; }
  .lb-prev, .lb-next { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,.08); border: none; color: #fff; font-size: 22px; padding: 14px 18px; cursor: pointer; transition: background .2s; border-radius: 4px; }
  .lb-prev { left: 16px; } .lb-next { right: 16px; }
  .lb-prev:hover, .lb-next:hover { background: rgba(255,255,255,.18); }
  .lb-counter { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); font-family: var(--f-mono); font-size: 11px; letter-spacing: .2em; color: rgba(255,255,255,.45); }

  /* ── BOTTOM CTA ── */
  .bottom-cta { padding: 120px var(--gutter); border-top: 1px solid var(--line); text-align: center; }
  .bottom-cta h2 { font-family: var(--f-display); font-size: clamp(48px, 9vw, 140px); text-transform: uppercase; line-height: .88; margin-bottom: 48px; }
  .bottom-cta h2 em { color: var(--accent); font-style: italic; }

  /* ── RESPONSIVE ── */
  @media (max-width: 1024px) {
    .video-grid { grid-template-columns: repeat(4, 1fr); }
    .shorts-grid { grid-template-columns: repeat(3, 1fr); }
  }
  @media (max-width: 880px) {
    .tabs { grid-template-columns: 1fr; }
    .tab-btn { border-right: none; border-bottom: 1px solid var(--line); }
    .tab-btn:last-child { border-bottom: none; }
    .video-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .video-section-header { padding: 40px var(--gutter) 16px; }
    .shorts-grid { grid-template-columns: repeat(2, 1fr); }
    .photo-masonry { columns: 4; }
  }
  @media (max-width: 640px) {
    /* 1 colonne — les miniatures sont lisibles, les titres ne se marchent plus dessus */
    .video-grid { grid-template-columns: 1fr; gap: 20px; }
    .video-section-label { font-size: 24px; }
    .vcard-overlay { opacity: 1; }
    .vcard-overlay-title { font-size: 13px; }
    .vcard-overlay-meta  { font-size: 11px; }
    .vcard-below { display: block; }
    .shorts-grid { grid-template-columns: 1fr; }
    .photo-masonry { columns: 2; }
    .event-pill { padding: 14px 18px; font-size: 14px; }
  }
</style>
</head>

  function videoCard(v) {
    const yt    = `https://youtu.be/${v.youtube_id}`;
    const thumb = v.thumbnail || `https://img.youtube.com/vi/${v.youtube_id}/hqdefault.jpg`;
    const views = v.views_label && v.views_label !== '—' ? v.views_label : '';
    return `
      <div class="vcard" data-yt="${esc(v.youtube_id)}">
        <div class="vcard-frame">
          <img src="${esc(thumb)}" alt="${esc(v.title)}" loading="lazy" onerror="if(!this.dataset.fb){this.dataset.fb=1;this.src='https://img.youtube.com/vi/${esc(v.youtube_id)}/hqdefault.jpg'}">
          <div class="vcard-iframe-wrap"></div>
          <a class="vcard-overlay" href="${esc(yt)}" target="_blank" rel="noopener" aria-label="${esc(v.title)}">
            <div class="vcard-overlay-title">${esc(v.title)}</div>
            <div class="vcard-overlay-meta">
              ${views ? `<span class="vcard-overlay-views">${esc(views)} vues</span><span>·</span>` : ''}
              <span>${esc(v.creator)}</span>
              ${v.date_label ? `<span>·</span><span>${esc(v.date_label)}</span>` : ''}
            </div>
          </a>
        </div>
        <div class="vcard-below">
          <span class="vcard-below-name">${esc(v.creator)}</span>
          <span class="vcard-below-sep">·</span>
          <span class="vcard-below-date">${esc(v.date_label)}</span>
        </div>
      </div>`;
  }

  function attachHoverPlay() {
    document.querySelectorAll('#grid-montage .vcard[data-yt]').forEach(card => {  // cherche dans tous les .video-grid injectés
      const wrap = card.querySelector('.vcard-iframe-wrap');
      let timer;
      card.addEventListener('mouseenter', () => {
        timer = setTimeout(() => {
          const id = card.dataset.yt;
          wrap.innerHTML = `<iframe src="https://www.youtube.com/embed/${id}?autoplay=1&mute=1&controls=0&loop=1&playlist=${id}&playsinline=1&rel=0" allow="autoplay" allowfullscreen></iframe>`;
          wrap.classList.add('playing');
        }, 400);
      });
      card.addEventListener('mouseleave', () => {
        clearTimeout(timer);
        wrap.classList.remove('playing');
        setTimeout(() => { wrap.innerHTML = ''; }, 500);
      });
    });
  }

  function renderVideos() {
    const wrap = document.getElementById('grid-montage');
    const filtered = activeVideoFilter === 'all' ? allVideos : allVideos.filter(v => v.tag === activeVideoFilter);
    if (!filtered.length) {
      wrap.innerHTML = `<div class="video-empty">Aucune vidéo dans cette catégorie.</div>`;
      return;
    }
    document.getElementById('cnt-montage').textContent = allVideos.length;

    if (activeVideoFilter !== 'all') {
      const meta = SECTION_META[activeVideoFilter] || {};
      wrap.innerHTML = `
        <div class="video-section-header">
          <span class="video-section-label">${esc(meta.label || activeVideoFilter)}</span>
          ${meta.desc ? `<span class="video-section-desc">${esc(meta.desc)}</span>` : ''}
        </div>
        <div class="video-grid">${filtered.map(v => videoCard(v)).join('')}</div>`;
    } else {
      /* Regrouper par tag dans l'ordre défini */
      const groups = {};
      filtered.forEach(v => { const t = v.tag || 'Autre'; if (!groups[t]) groups[t] = []; groups[t].push(v); });
      const order = [...VIDEO_ORDER.filter(t => groups[t]), ...Object.keys(groups).filter(t => !VIDEO_ORDER.includes(t))];
      wrap.innerHTML = order.map(tag => {
        const meta = SECTION_META[tag] || { label: tag, desc: '' };
        return `
          <div class="video-section-header">
            <span class="video-section-label">${esc(meta.label)}</span>
            ${meta.desc ? `<span class="video-section-desc">${esc(meta.desc)}</span>` : ''}
          </div>
          <div class="video-grid">${groups[tag].map(v => videoCard(v)).join('')}</div>`;
      }).join('');
    }
    attachHoverPlay();
  }

  async function loadVideos() {
    try {
      const { data, error } = await sb.from('site_videos').select('*').eq('active', true).order('sort_order');
      if (error || !data?.length) throw error || new Error('vide');
      allVideos = data;
    } catch {
      allVideos = FALLBACK_VIDEOS;
    }
    renderVideos();
  }

  document.getElementById('filters-montage').addEventListener('click', e => {
    const btn = e.target.closest('.pill-filter');
    if (!btn) return;
    document.querySelectorAll('#filters-montage .pill-filter').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeVideoFilter = btn.dataset.filter;
    renderVideos();
  });

  /* ══════════════════ SHORTS ══════════════════ */
  let allShorts = [];
  let activeShortFilter = 'all';

  function shortCard(s) {
    const isIG = !s.youtube_id && s.src && s.src.includes('instagram.com');
    const href = s.youtube_id ? `https://youtu.be/${s.youtube_id}` : (s.src || '#');
    const thumb = s.thumbnail || (s.youtube_id ? `https://img.youtube.com/vi/${s.youtube_id}/hqdefault.jpg` : '');
    const igSvg = `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="2" y="2" width="20" height="20" rx="5" stroke="rgba(244,239,230,.6)" stroke-width="1.5"/><circle cx="12" cy="12" r="4" stroke="rgba(244,239,230,.6)" stroke-width="1.5"/><circle cx="17.5" cy="6.5" r="1" fill="rgba(244,239,230,.6)"/></svg>`;
    if (isIG) {
      if (thumb) {
        return `
          <a class="scard scard-ig" href="${href}" target="_blank" rel="noopener">
            <div class="scard-frame">
              <img src="${thumb}" alt="${esc(s.title)}" loading="lazy">
              <div class="scard-ig-badge">${igSvg}<span>Reel ↗</span></div>
            </div>
            <div class="scard-info">
              <h3>${esc(s.title)}</h3>
              <p>${esc(s.creator)}${s.date_label ? ` · ${esc(s.date_label)}` : ''}</p>
            </div>
          </a>`;
      }
      return `
        <a class="scard scard-ig" href="${href}" target="_blank" rel="noopener">
          <div class="scard-frame">
            <div class="scard-ig-inner">
              <svg width="36" height="36" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="2" y="2" width="20" height="20" rx="5" stroke="rgba(244,239,230,.4)" stroke-width="1.5"/><circle cx="12" cy="12" r="4" stroke="rgba(244,239,230,.4)" stroke-width="1.5"/><circle cx="17.5" cy="6.5" r="1" fill="rgba(244,239,230,.4)"/></svg>
              <span>Voir le Reel ↗</span>
            </div>
          </div>
          <div class="scard-info">
            <h3>${esc(s.title)}</h3>
            <p>${esc(s.creator)}${s.date_label ? ` · ${esc(s.date_label)}` : ''}</p>
          </div>
        </a>`;
    }
    return `
      <a class="scard" href="${href}" target="_blank" rel="noopener">
        <div class="scard-frame">
          ${thumb ? `<img src="${thumb}" alt="${esc(s.title)}" loading="lazy" onerror="if(!this.dataset.fb){this.dataset.fb=1;this.src='https://img.youtube.com/vi/${s.youtube_id}/hqdefault.jpg'}">` : ''}
          <div class="scard-play"><span>▶</span></div>
        </div>
        <div class="scard-info">
          <h3>${s.title}</h3>
          <p>${s.creator}<span class="sep">·</span>${s.date_label}</p>
        </div>
      </a>`;
  }

  function renderShorts() {
    const wrap = document.getElementById('shorts-body');
    const filtered = activeShortFilter === 'all' ? allShorts : allShorts.filter(s => s.tag === activeShortFilter);
    if (!allShorts.length) {
      document.getElementById('cnt-shorts').textContent = 'bientôt';
      wrap.innerHTML = `<div class="shorts-soon"><span class="shorts-soon-rule"></span><span class="shorts-soon-label">Clips à venir</span><span class="shorts-soon-rule"></span></div>`;
      return;
    }
    document.getElementById('cnt-shorts').textContent = allShorts.length;
    if (!filtered.length) {
      wrap.innerHTML = `<div class="shorts-soon"><span class="shorts-soon-rule"></span><span class="shorts-soon-label">Aucun clip dans cette catégorie</span><span class="shorts-soon-rule"></span></div>`;
      return;
    }
    if (activeShortFilter !== 'all') {
      const meta = SECTION_META[activeShortFilter] || {};
      wrap.innerHTML = `
        <div class="video-section-header">
          <span class="video-section-label">${esc(meta.label || activeShortFilter)}</span>
          ${meta.desc ? `<span class="video-section-desc">${esc(meta.desc)}</span>` : ''}
        </div>
        <div class="shorts-grid">${filtered.map(shortCard).join('')}</div>`;
    } else {
      const groups = {};
      filtered.forEach(s => { const t = s.tag || 'Autre'; if (!groups[t]) groups[t] = []; groups[t].push(s); });
      const order = [...SHORTS_ORDER.filter(t => groups[t]), ...Object.keys(groups).filter(t => !SHORTS_ORDER.includes(t))];
      wrap.innerHTML = order.map(tag => {
        const meta = SECTION_META[tag] || { label: tag, desc: '' };
        return `
          <div class="video-section-header">
            <span class="video-section-label">${esc(meta.label)}</span>
            ${meta.desc ? `<span class="video-section-desc">${esc(meta.desc)}</span>` : ''}
          </div>
          <div class="shorts-grid">${groups[tag].map(shortCard).join('')}</div>`;
      }).join('');
    }
  }

  async function loadShorts() {
    try {
      const { data, error } = await sb.from('site_shorts').select('*').eq('active', true).order('sort_order');
      if (error) throw error;
      allShorts = data || [];
    } catch {
      allShorts = [];
    }
    renderShorts();
  }

  document.getElementById('filters-shorts').addEventListener('click', e => {
    const btn = e.target.closest('.pill-filter');
    if (!btn) return;
    document.querySelectorAll('#filters-shorts .pill-filter').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeShortFilter = btn.dataset.filter;
    renderShorts();
  });

  /* ══════════════════ PHOTOS ══════════════════ */
  let lbPhotos = [], lbIdx = 0;
  const lightbox = document.getElementById('lightbox');
  const lbImg    = document.getElementById('lb-img');
  const lbCount  = document.getElementById('lb-counter');

  function openLb(photos, idx) {
    lbPhotos = photos; lbIdx = ((idx % photos.length) + photos.length) % photos.length;
    lbImg.src = photoSrc(photos[lbIdx].src); lbImg.alt = photos[lbIdx].caption || '';
    lbCount.textContent = `${lbIdx + 1} / ${photos.length}`;
    lightbox.classList.add('open'); document.body.style.overflow = 'hidden';
  }
  function closeLb() { lightbox.classList.remove('open'); document.body.style.overflow = ''; }
  function navLb(d) {
    lbIdx = ((lbIdx + d + lbPhotos.length) % lbPhotos.length);
    lbImg.src = photoSrc(lbPhotos[lbIdx].src); lbImg.alt = lbPhotos[lbIdx].caption || '';
    lbCount.textContent = `${lbIdx + 1} / ${lbPhotos.length}`;
  }
  document.getElementById('lb-close').addEventListener('click', closeLb);
  document.getElementById('lb-prev').addEventListener('click', () => navLb(-1));
  document.getElementById('lb-next').addEventListener('click', () => navLb(1));
  lightbox.addEventListener('click', e => { if (e.target === lightbox) closeLb(); });
  document.addEventListener('keydown', e => {
    if (!lightbox.classList.contains('open')) return;
    if (e.key === 'Escape') closeLb();
    if (e.key === 'ArrowLeft') navLb(-1);
    if (e.key === 'ArrowRight') navLb(1);
  });

  function photoSrc(src) {
    return src.split('/').map((seg, i) => i === 0 ? seg : encodeURIComponent(seg)).join('/');
  }
  function buildMasonry(photos) {
    return `<div class="photo-masonry">${photos.map((p, i) => `
      <div class="photo-item" data-idx="${i}" role="button" tabindex="0" aria-label="${esc(p.caption || 'Photo')}">
        <img src="${photoSrc(p.src)}" alt="${esc(p.caption || '')}" loading="lazy">
        <div class="photo-overlay"><span>Voir ⤢</span></div>
      </div>`).join('')}</div>`;
  }

  let allEvents = [], allPhotoRows = [], activeEventId = null;

  function renderEventGrid(eventId) {
    const grid = document.getElementById('photo-grid-wrap');
    const ev = allEvents.find(e => e.id === eventId);
    if (!ev || ev.status !== 'published') {
      grid.innerHTML = `<div style="padding:80px var(--gutter);text-align:center;font-family:var(--f-mono);font-size:13px;letter-spacing:.1em;color:var(--fg-faint)">Photos bientôt disponibles</div>`;
      return;
    }
    const photos = allPhotoRows.filter(p => p.event_id === eventId);
    grid.innerHTML = buildMasonry(photos);
    grid.querySelectorAll('.photo-item').forEach(item => {
      item.addEventListener('click', () => openLb(photos, +item.dataset.idx));
      item.addEventListener('keydown', e => { if (e.key === 'Enter') openLb(photos, +item.dataset.idx); });
    });
  }

  function selectEvent(eventId) {
    activeEventId = eventId;
    document.querySelectorAll('.event-pill').forEach(p => p.classList.toggle('active', +p.dataset.id === eventId));
    renderEventGrid(eventId);
  }

  async function loadPhotos() {
    const selector = document.getElementById('event-selector');
    let events = [], photos = [];
    try {
      const [evRes, phRes] = await Promise.all([
        sb.from('site_events').select('*').eq('active', true).order('sort_order'),
        sb.from('site_photos').select('*').eq('active', true).order('sort_order'),
      ]);
      if (!evRes.error && evRes.data?.length) { events = evRes.data; photos = phRes.data || []; }
    } catch {}

    if (!events.length) {
      events = [
        { id:1, name:'24H du Mans', year:2025, slug:'24h-2025', status:'published', sort_order:1 },
      ];
      photos = [
        { event_id:1, src:'uploads/PHOTO/DSC03270.jpg', caption:'24H du Mans 2025', sort_order:1 },
        { event_id:1, src:'uploads/PHOTO/DSC04947.jpeg', caption:'24H du Mans 2025', sort_order:2 },
      ];
    }

    allEvents = events; allPhotoRows = photos;
    const totalPhotos = photos.length;
    document.getElementById('cnt-photo').textContent = totalPhotos + ' photos';

    selector.innerHTML = events.map(ev => {
      const count = photos.filter(p => p.event_id === ev.id).length;
      const isSoon = ev.status !== 'published';
      return `<button class="event-pill${isSoon ? ' soon-event' : ''}" data-id="${ev.id}" ${isSoon ? 'disabled' : ''}>
        ${esc(ev.name)} <em style="color:var(--accent);font-style:italic">${ev.year}</em>
        <span class="pill-count">${isSoon ? 'bientôt' : count}</span>
      </button>`;
    }).join('');

    selector.querySelectorAll('.event-pill:not(.soon-event)').forEach(btn => {
      btn.addEventListener('click', () => selectEvent(+btn.dataset.id));
    });

    const firstPublished = events.find(e => e.status === 'published');
    if (firstPublished) selectEvent(firstPublished.id);
  }

  /* ══════════════════ TABS ══════════════════ */
  let loaded = { montage: false, shorts: false, photo: false };

  function activateTab(name) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
    document.querySelectorAll('.tab-section').forEach(s => s.classList.toggle('active', s.id === 'tab-' + name));
    if (!loaded[name]) {
      loaded[name] = true;
      if (name === 'montage') loadVideos();
      if (name === 'shorts')  loadShorts();
      if (name === 'photo')   loadPhotos();
    }
  }

  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => activateTab(btn.dataset.tab));
  });

  // Charge l'onglet actif au démarrage
  activateTab('montage');
</script>
</body>
</html>
