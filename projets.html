<style>
  /* ── PAGE HEAD ── */
  .page-head {
    padding: 160px var(--gutter) 56px;
    border-bottom: 1px solid var(--line);
  }
  .page-head h1 {
    font-family: var(--f-display);
    font-size: clamp(72px, 13vw, 200px);
    line-height: .84;
    text-transform: uppercase;
  }
  .page-head h1 em { color: var(--accent); font-style: italic; }

  /* ── TABS ── */
  .tabs {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    border-bottom: 1px solid var(--line);
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 20;
  }
  .tab-btn {
    padding: 28px var(--gutter);
    font-family: var(--f-display);
    font-size: clamp(22px, 3vw, 44px);
    text-transform: uppercase;
    color: var(--fg-dim);
    border: none;
    border-right: 1px solid var(--line);
    background: none;
    cursor: pointer;
    text-align: left;
    display: flex;
    align-items: center;
    gap: 14px;
    transition: color .2s, background .2s;
    position: relative;
  }
  .tab-btn:last-child { border-right: none; }
  .tab-btn .tab-num {
    font-family: var(--f-mono);
    font-size: 11px;
    letter-spacing: .28em;
    color: var(--fg-faint);
  }
  .tab-btn .tab-count {
    margin-left: auto;
    font-family: var(--f-mono);
    font-size: 11px;
    color: var(--fg-faint);
  }
  .tab-btn:hover { color: var(--fg); background: var(--surface); }
  .tab-btn.active { color: var(--fg); }
  .tab-btn.active::after {
    content: '';
    position: absolute;
    bottom: -1px; left: 0; right: 0;
    height: 2px;
    background: var(--accent);
  }

  /* ── FILTER PILLS ── */
  .filters {
    display: flex;
    gap: 10px;
    padding: 24px var(--gutter);
    border-bottom: 1px solid var(--line);
    flex-wrap: wrap;
  }
  .pill-filter {
    font-family: var(--f-mono);
    font-size: 11px;
    letter-spacing: .18em;
    text-transform: uppercase;
    padding: 7px 18px;
    border-radius: 100px;
    border: 1px solid var(--line);
    background: none;
    color: var(--fg-dim);
    cursor: pointer;
    transition: all .2s;
  }
  .pill-filter:hover { border-color: var(--fg-faint); color: var(--fg); }
  .pill-filter.active { background: var(--fg); color: var(--bg); border-color: var(--fg); }

  /* ── TAB SECTIONS ── */
  .tab-section { display: none; }
  .tab-section.active { display: block; }

  /* ── GRILLE VIDÉOS ── */
  .video-grid {
    padding: 48px var(--gutter) 100px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 48px 28px;
  }
  .vcard {
    display: block;
    text-decoration: none;
    color: var(--fg);
  }
  .vcard-frame {
    position: relative;
    aspect-ratio: 16/9;
    background: var(--surface);
    overflow: hidden;
    border-radius: 4px;
    margin-bottom: 14px;
  }
  .vcard-frame img {
    width: 100%; height: 100%;
    object-fit: cover; display: block;
    transition: transform .6s var(--ease), filter .5s;
  }
  .vcard:hover .vcard-frame img { transform: scale(1.04); filter: brightness(1.05); }
  .vcard.featured { grid-column: span 2; }
  .vcard.featured .vcard-frame { aspect-ratio: 21/9; }
  .vcard-play {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,0); transition: background .3s;
  }
  .vcard-play span { font-size: 36px; opacity: 0; transform: scale(.8); transition: opacity .3s, transform .3s; }
  .vcard:hover .vcard-play { background: rgba(0,0,0,.28); }
  .vcard:hover .vcard-play span { opacity: 1; transform: scale(1); }
  .vcard-tag {
    position: absolute; top: 10px; left: 10px;
    font-family: var(--f-mono); font-size: 10px; letter-spacing: .18em;
    text-transform: uppercase; color: #fff;
    background: rgba(0,0,0,.72); padding: 3px 9px; border-radius: 3px;
  }
  .vcard-meta { display: flex; gap: 12px; align-items: flex-start; }
  .vcard-avatar { width: 36px; height: 36px; border-radius: 50%; overflow: hidden; flex-shrink: 0; background: var(--surface); }
  .vcard-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .vcard-info h3 { font-family: var(--f-sans); font-size: 14px; font-weight: 500; line-height: 1.4; margin-bottom: 4px; }
  .vcard-info p { font-family: var(--f-mono); font-size: 11px; color: var(--fg-dim); }
  .sep { margin: 0 6px; opacity: .4; }
  .video-empty { padding: 80px var(--gutter); text-align: center; color: var(--fg-faint); font-family: var(--f-mono); font-size: 13px; letter-spacing: .1em; }

  /* ── GRILLE SHORTS ── */
  .shorts-grid {
    padding: 48px var(--gutter) 100px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 24px;
  }
  .scard { display: block; text-decoration: none; color: var(--fg); }
  .scard-frame {
    position: relative; aspect-ratio: 9/16;
    background: var(--surface); overflow: hidden; border-radius: 4px; margin-bottom: 12px;
  }
  .scard-frame img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .6s var(--ease); }
  .scard:hover .scard-frame img { transform: scale(1.04); }
  .scard-play {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,0); transition: background .3s;
  }
  .scard-play span { font-size: 28px; opacity: 0; transform: scale(.8); transition: opacity .3s, transform .3s; }
  .scard:hover .scard-play { background: rgba(0,0,0,.28); }
  .scard:hover .scard-play span { opacity: 1; transform: scale(1); }
  .scard-info h3 { font-family: var(--f-sans); font-size: 13px; font-weight: 500; line-height: 1.4; margin-bottom: 4px; }
  .scard-info p { font-family: var(--f-mono); font-size: 11px; color: var(--fg-dim); }
  .shorts-soon {
    padding: 72px var(--gutter) 100px;
    display: flex; align-items: center; gap: 32px;
  }
  .shorts-soon-rule { flex: 1; height: 1px; background: var(--line); }
  .shorts-soon-label { font-family: var(--f-mono); font-size: 11px; letter-spacing: .3em; text-transform: uppercase; color: var(--fg-faint); white-space: nowrap; }

  /* ── PHOTOS PAR ÉVÉNEMENT ── */
  .photos-wrap { padding: 0 0 80px; }
  .event-block { border-top: 1px solid var(--line); }
  .event-block-head {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 24px; padding: 28px var(--gutter); cursor: pointer; user-select: none;
  }
  .event-title {
    font-family: var(--f-display);
    font-size: clamp(28px, 4vw, 60px);
    text-transform: uppercase; line-height: 1;
    transition: color .2s;
  }
  .event-title em { color: var(--accent); font-style: italic; }
  .event-block-head:hover .event-title { color: var(--accent); }
  .event-meta { font-family: var(--f-mono); font-size: 11px; letter-spacing: .2em; color: var(--fg-faint); display: flex; align-items: center; gap: 16px; flex-shrink: 0; }
  .event-toggle { font-size: 20px; transition: transform .3s; display: inline-block; }
  .event-block.open .event-toggle { transform: rotate(45deg); }
  .event-block-body { overflow: hidden; max-height: 0; transition: max-height .6s cubic-bezier(.22,1,.36,1); }
  .event-block.open .event-block-body { max-height: 6000px; }
  .soon-pill { font-family: var(--f-mono); font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--fg-faint); border: 1px solid var(--line); padding: 6px 16px; border-radius: 100px; }
  .photo-masonry { columns: 3; column-gap: 14px; padding: 0 var(--gutter) 48px; }
  .photo-item { break-inside: avoid; margin-bottom: 14px; position: relative; overflow: hidden; border-radius: 4px; cursor: pointer; }
  .photo-item img { width: 100%; display: block; transition: transform .5s var(--ease); }
  .photo-item:hover img { transform: scale(1.03); }
  .photo-overlay { position: absolute; inset: 0; background: rgba(0,0,0,.35); display: flex; align-items: flex-end; padding: 14px; opacity: 0; transition: opacity .3s; }
  .photo-item:hover .photo-overlay { opacity: 1; }
  .photo-overlay span { font-family: var(--f-mono); font-size: 11px; letter-spacing: .2em; color: #fff; }

  /* ── LIGHTBOX ── */
  .lightbox { display: none; position: fixed; inset: 0; z-index: 9000; background: rgba(0,0,0,.94); align-items: center; justify-content: center; }
  .lightbox.open { display: flex; }
  .lb-img { max-width: 90vw; max-height: 88vh; object-fit: contain; border-radius: 4px; }
  .lb-close { position: absolute; top: 20px; right: 24px; background: none; border: none; color: #fff; font-size: 28px; cursor: pointer; opacity: .7; transition: opacity .2s; }
  .lb-close:hover { opacity: 1; }
  .lb-prev, .lb-next { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,.08); border: none; color: #fff; font-size: 22px; padding: 14px 18px; cursor: pointer; transition: background .2s; border-radius: 4px; }
  .lb-prev { left: 16px; } .lb-next { right: 16px; }
  .lb-prev:hover, .lb-next:hover { background: rgba(255,255,255,.18); }
  .lb-counter { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); font-family: var(--f-mono); font-size: 11px; letter-spacing: .2em; color: rgba(255,255,255,.45); }

  /* ── BOTTOM CTA ── */
  .bottom-cta { padding: 120px var(--gutter); border-top: 1px solid var(--line); text-align: center; }
  .bottom-cta h2 { font-family: var(--f-display); font-size: clamp(48px, 9vw, 140px); text-transform: uppercase; line-height: .88; margin-bottom: 48px; }
  .bottom-cta h2 em { color: var(--accent); font-style: italic; }

  /* ── RESPONSIVE ── */
  @media (max-width: 1024px) {
    .video-grid { grid-template-columns: repeat(2, 1fr); }
    .vcard.featured { grid-column: span 2; }
    .shorts-grid { grid-template-columns: repeat(3, 1fr); }
  }
  @media (max-width: 880px) {
    .tabs { grid-template-columns: 1fr; }
    .tab-btn { border-right: none; border-bottom: 1px solid var(--line); }
    .tab-btn:last-child { border-bottom: none; }
    .video-grid { grid-template-columns: 1fr 1fr; gap: 28px 14px; }
    .shorts-grid { grid-template-columns: repeat(2, 1fr); }
    .photo-masonry { columns: 2; }
  }
  @media (max-width: 640px) {
    .video-grid { grid-template-columns: 1fr; }
    .vcard.featured { grid-column: span 1; }
    .vcard.featured .vcard-frame { aspect-ratio: 16/9; }
    .shorts-grid { grid-template-columns: repeat(2, 1fr); }
    .photo-masonry { columns: 1; }
  }
</style>
</head>

<script>
  window.injectChrome('projects');

  const SB_URL = 'https://kmsimclzeitnnbbemeij.supabase.co';
  const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imttc2ltY2x6ZWl0bm5iYmVtZWlqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk0Nzc1NzYsImV4cCI6MjA5NTA1MzU3Nn0.w9uNRA5g37SBgB9wvE-iSIrWcYLIU8jcw27cEwAM7mg';
  const sb = window.supabase.createClient(SB_URL, SB_KEY);

  /* ── Fallback si Supabase indisponible ── */
  const FALLBACK_VIDEOS = [
    { youtube_id:'r0zvh0ElcnM', title:'QUI EST LE JOUEUR PRO ?! (ft. Gradur & Redouane Bougheraba)', creator:'Pitch Addict',  views_label:'552 k', date_label:'Mai 2026',   thumbnail:'uploads/miniadvlp.jpg',           avatar:'uploads/channels4_profile.png',      tag:'Storytelling', sort_order:1 },
    { youtube_id:'UqYMpBAAEA8', title:"LE MEILLEUR BARBER D'INTERNET ! (ft Inoxtag Joyca Nico)",       creator:'Hairtist',      views_label:'552 k', date_label:'Août 2025',  thumbnail:'uploads/maxresdefault (1).jpg',    avatar:'uploads/unnamed.jpg',                tag:'Multicam',     sort_order:2 },
    { youtube_id:'-YiWp9Usmr0', title:"J'ai acheté 10 VALISES PERDUES (c'est trop RENTABLE)",          creator:'Camille LV',    views_label:'766 k', date_label:'Févr. 2024', thumbnail:'uploads/maxresdefault (2).jpg',    avatar:'uploads/channels4_profile (2).jpg',  tag:'Storytelling', sort_order:3 },
    { youtube_id:'Tnw8BUV8Y8s', title:'On goûte les 20 aliments préférés des français',                creator:'Pierre Croce',  views_label:'135 k', date_label:'Nov. 2025',  thumbnail:'uploads/maxresdefault (3).jpg',    avatar:'uploads/channels4_profile (3).jpg',  tag:'Facecam',      sort_order:4 },
    { youtube_id:'F77U_yuUb5s', title:'CACHE CACHE DANS UNE BIBLIOTHÈQUE (MAIS fais pas de bruit)',     creator:'Guizzi',        views_label:'532 k', date_label:'Sept. 2024', thumbnail:'uploads/maxresdefault (4).jpg',    avatar:'uploads/channels4_profile (4).jpg',  tag:'Multicam',     sort_order:5 },
    { youtube_id:'es62U2hFlA4', title:"MATHIS DUMAS ME DÉVOILE LES SECRETS DE L'EVEREST AVEC INOXTAG", creator:'Hairtist',      views_label:'610 k', date_label:'Sept. 2024', thumbnail:'uploads/maxresdefault (5).jpg',    avatar:'uploads/unnamed.jpg',                tag:'Interview',    sort_order:6 },
  ];

  /* ══════════════════ MONTAGE ══════════════════ */
  let allVideos = [];
  let activeVideoFilter = 'all';

  function videoCard(v, featured) {
    const yt = `https://youtu.be/${v.youtube_id}`;
    const thumb = v.thumbnail || `https://img.youtube.com/vi/${v.youtube_id}/maxresdefault.jpg`;
    return `
      <a class="vcard${featured ? ' featured' : ''}" href="${yt}" target="_blank" rel="noopener">
        <div class="vcard-frame">
          <img src="${thumb}" alt="${v.title}" loading="lazy">
          <span class="vcard-tag">${v.tag || ''}</span>
          <div class="vcard-play"><span>▶</span></div>
        </div>
        <div class="vcard-meta">
          <div class="vcard-avatar">${v.avatar ? `<img src="${v.avatar}" alt="${v.creator}">` : ''}</div>
          <div class="vcard-info">
            <h3>${v.title}</h3>
            <p>${v.creator}${v.views_label && v.views_label !== '—' ? `<span class="sep">·</span>${v.views_label} vues` : ''}<span class="sep">·</span>${v.date_label}</p>
          </div>
        </div>
      </a>`;
  }

  function renderVideos() {
    const grid = document.getElementById('grid-montage');
    const filtered = activeVideoFilter === 'all' ? allVideos : allVideos.filter(v => v.tag === activeVideoFilter);
    if (!filtered.length) {
      grid.innerHTML = `<div class="video-empty" style="grid-column:1/-1">Aucune vidéo dans cette catégorie.</div>`;
      return;
    }
    grid.innerHTML = filtered.map((v, i) => videoCard(v, i === 0 && activeVideoFilter === 'all')).join('');
    document.getElementById('cnt-montage').textContent = allVideos.length;
  }

  async function loadVideos() {
    try {
      const { data, error } = await sb.from('site_videos').select('*').eq('active', true).order('sort_order');
      if (error || !data?.length) throw error || new Error('vide');
      allVideos = data;
    } catch {
      allVideos = FALLBACK_VIDEOS;
    }
    renderVideos();
  }

  document.getElementById('filters-montage').addEventListener('click', e => {
    const btn = e.target.closest('.pill-filter');
    if (!btn) return;
    document.querySelectorAll('#filters-montage .pill-filter').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeVideoFilter = btn.dataset.filter;
    renderVideos();
  });

  /* ══════════════════ SHORTS ══════════════════ */
  let allShorts = [];
  let activeShortFilter = 'all';

  function shortCard(s) {
    const href = s.youtube_id ? `https://youtu.be/${s.youtube_id}` : (s.src || '#');
    const thumb = s.thumbnail || (s.youtube_id ? `https://img.youtube.com/vi/${s.youtube_id}/mqdefault.jpg` : '');
    return `
      <a class="scard" href="${href}" target="_blank" rel="noopener">
        <div class="scard-frame">
          ${thumb ? `<img src="${thumb}" alt="${s.title}" loading="lazy">` : ''}
          <div class="scard-play"><span>▶</span></div>
        </div>
        <div class="scard-info">
          <h3>${s.title}</h3>
          <p>${s.creator}<span class="sep">·</span>${s.date_label}</p>
        </div>
      </a>`;
  }

  function renderShorts() {
    const body = document.getElementById('shorts-body');
    const filtered = activeShortFilter === 'all' ? allShorts : allShorts.filter(s => s.tag === activeShortFilter);
    if (!allShorts.length) {
      document.getElementById('cnt-shorts').textContent = 'bientôt';
      body.innerHTML = `<div class="shorts-soon"><span class="shorts-soon-rule"></span><span class="shorts-soon-label">Clips à venir</span><span class="shorts-soon-rule"></span></div>`;
      return;
    }
    document.getElementById('cnt-shorts').textContent = allShorts.length;
    if (!filtered.length) {
      body.innerHTML = `<div class="shorts-soon"><span class="shorts-soon-rule"></span><span class="shorts-soon-label">Aucun clip dans cette catégorie</span><span class="shorts-soon-rule"></span></div>`;
      return;
    }
    body.innerHTML = `<div class="shorts-grid">${filtered.map(shortCard).join('')}</div>`;
  }

  async function loadShorts() {
    try {
      const { data, error } = await sb.from('site_shorts').select('*').eq('active', true).order('sort_order');
      if (error) throw error;
      allShorts = data || [];
    } catch {
      allShorts = [];
    }
    renderShorts();
  }

  document.getElementById('filters-shorts').addEventListener('click', e => {
    const btn = e.target.closest('.pill-filter');
    if (!btn) return;
    document.querySelectorAll('#filters-shorts .pill-filter').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeShortFilter = btn.dataset.filter;
    renderShorts();
  });

  /* ══════════════════ PHOTOS ══════════════════ */
  let lbPhotos = [], lbIdx = 0;
  const lightbox = document.getElementById('lightbox');
  const lbImg    = document.getElementById('lb-img');
  const lbCount  = document.getElementById('lb-counter');

  function openLb(photos, idx) {
    lbPhotos = photos; lbIdx = ((idx % photos.length) + photos.length) % photos.length;
    lbImg.src = photos[lbIdx].src; lbImg.alt = photos[lbIdx].caption || '';
    lbCount.textContent = `${lbIdx + 1} / ${photos.length}`;
    lightbox.classList.add('open'); document.body.style.overflow = 'hidden';
  }
  function closeLb() { lightbox.classList.remove('open'); document.body.style.overflow = ''; }
  function navLb(d) {
    lbIdx = ((lbIdx + d + lbPhotos.length) % lbPhotos.length);
    lbImg.src = lbPhotos[lbIdx].src; lbImg.alt = lbPhotos[lbIdx].caption || '';
    lbCount.textContent = `${lbIdx + 1} / ${lbPhotos.length}`;
  }
  document.getElementById('lb-close').addEventListener('click', closeLb);
  document.getElementById('lb-prev').addEventListener('click', () => navLb(-1));
  document.getElementById('lb-next').addEventListener('click', () => navLb(1));
  lightbox.addEventListener('click', e => { if (e.target === lightbox) closeLb(); });
  document.addEventListener('keydown', e => {
    if (!lightbox.classList.contains('open')) return;
    if (e.key === 'Escape') closeLb();
    if (e.key === 'ArrowLeft') navLb(-1);
    if (e.key === 'ArrowRight') navLb(1);
  });

  function buildMasonry(photos) {
    return photos.map((p, i) => `
      <div class="photo-item" data-idx="${i}" role="button" tabindex="0" aria-label="${p.caption || 'Photo'}">
        <img src="${p.src}" alt="${p.caption || ''}" loading="lazy">
        <div class="photo-overlay"><span>Voir ⤢</span></div>
      </div>`).join('');
  }

  function buildEventBlock(ev, photos, openByDefault) {
    const isPublished = ev.status === 'published';
    const metaHtml = isPublished
      ? `<div class="event-meta"><span>${photos.length} photo${photos.length > 1 ? 's' : ''}</span><span class="event-toggle">+</span></div>`
      : `<div class="event-meta"><span class="soon-pill">Bientôt</span></div>`;
    const bodyHtml = isPublished
      ? `<div class="event-block-body"><div class="photo-masonry" id="masonry-${ev.slug}">${buildMasonry(photos)}</div></div>`
      : '';
    return `
      <div class="event-block${isPublished && openByDefault ? ' open' : ''}" id="block-${ev.slug}" data-published="${isPublished}">
        <div class="event-block-head">
          <span class="event-title">${ev.name} <em>${ev.year}</em></span>
          ${metaHtml}
        </div>
        ${bodyHtml}
      </div>`;
  }

  async function loadPhotos() {
    const wrap = document.getElementById('events-wrap');
    const FALLBACK_EVENTS = [
      { id: 1, name: '24H du Mans', year: 2025, slug: '24h-2025', status: 'published', sort_order: 1 },
      { id: 2, name: '24H du Mans', year: 2026, slug: '24h-2026', status: 'soon',      sort_order: 2 },
      { id: 3, name: 'Route du Rhum', year: 2026, slug: 'rhum-2026', status: 'soon',   sort_order: 3 },
    ];
    const FALLBACK_PHOTOS = [
      { event_id:1, src:'uploads/PHOTO/DSC03270.jpg',    caption:'24H du Mans 2025', sort_order:1 },
      { event_id:1, src:'uploads/PHOTO/DSC04947.jpeg',   caption:'24H du Mans 2025', sort_order:2 },
      { event_id:1, src:'uploads/PHOTO/DSC05020.jpeg',   caption:'24H du Mans 2025', sort_order:3 },
      { event_id:1, src:'uploads/PHOTO/DSC05054.jpeg',   caption:'24H du Mans 2025', sort_order:4 },
      { event_id:1, src:'uploads/PHOTO/DSC05080.jpeg',   caption:'24H du Mans 2025', sort_order:5 },
      { event_id:1, src:'uploads/PHOTO/DSC05088.jpeg',   caption:'24H du Mans 2025', sort_order:6 },
      { event_id:1, src:'uploads/PHOTO/DSC05115.jpeg',   caption:'24H du Mans 2025', sort_order:7 },
      { event_id:1, src:'uploads/PHOTO/DSC05399.jpeg',   caption:'24H du Mans 2025', sort_order:8 },
      { event_id:1, src:'uploads/PHOTO/DSC07198.jpeg',   caption:'24H du Mans 2025', sort_order:9 },
      { event_id:1, src:'uploads/PHOTO/DSC07207.jpeg',   caption:'24H du Mans 2025', sort_order:10 },
      { event_id:1, src:'uploads/PHOTO/DSC07222.jpeg',   caption:'24H du Mans 2025', sort_order:11 },
      { event_id:1, src:'uploads/PHOTO/DSC07248.jpeg',   caption:'24H du Mans 2025', sort_order:12 },
      { event_id:1, src:'uploads/PHOTO/IMG_1746.jpeg',   caption:'24H du Mans 2025', sort_order:13 },
      { event_id:1, src:'uploads/PHOTO/IMG_1753.jpeg',   caption:'24H du Mans 2025', sort_order:14 },
      { event_id:1, src:'uploads/PHOTO/IMG_1760.jpeg',   caption:'24H du Mans 2025', sort_order:15 },
      { event_id:1, src:'uploads/PHOTO/IMG_1761.jpeg',   caption:'24H du Mans 2025', sort_order:16 },
      { event_id:1, src:'uploads/PHOTO/IMG_1763.jpeg',   caption:'24H du Mans 2025', sort_order:17 },
      { event_id:1, src:'uploads/PHOTO/IMG_1769 2.jpeg', caption:'24H du Mans 2025', sort_order:18 },
    ];

    let events = FALLBACK_EVENTS, photos = FALLBACK_PHOTOS;
    try {
      const [evRes, phRes] = await Promise.all([
        sb.from('site_events').select('*').eq('active', true).order('sort_order'),
        sb.from('site_photos').select('*').eq('active', true).order('sort_order'),
      ]);
      if (!evRes.error && evRes.data?.length) { events = evRes.data; photos = phRes.data || []; }
    } catch {}

    const totalPhotos = photos.length;
    document.getElementById('cnt-photo').textContent = totalPhotos + ' photos';

    wrap.innerHTML = events.map((ev, i) => {
      const evPhotos = photos.filter(p => p.event_id === ev.id);
      return buildEventBlock(ev, evPhotos, i === 0);
    }).join('');

    // Accordéon + lightbox
    wrap.querySelectorAll('.event-block[data-published="true"]').forEach(block => {
      block.querySelector('.event-block-head').addEventListener('click', () => {
        block.classList.toggle('open');
      });
      const slug = block.id.replace('block-', '');
      const eventId = events.find(e => e.slug === slug)?.id;
      const evPhotos = photos.filter(p => p.event_id === eventId);
      block.querySelectorAll('.photo-item').forEach(item => {
        item.addEventListener('click', () => openLb(evPhotos, +item.dataset.idx));
        item.addEventListener('keydown', e => { if (e.key === 'Enter') openLb(evPhotos, +item.dataset.idx); });
      });
    });
  }

  /* ══════════════════ TABS ══════════════════ */
  let loaded = { montage: false, shorts: false, photo: false };

  function activateTab(name) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
    document.querySelectorAll('.tab-section').forEach(s => s.classList.toggle('active', s.id === 'tab-' + name));
    if (!loaded[name]) {
      loaded[name] = true;
      if (name === 'montage') loadVideos();
      if (name === 'shorts')  loadShorts();
      if (name === 'photo')   loadPhotos();
    }
  }

  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => activateTab(btn.dataset.tab));
  });

  // Charge l'onglet actif au démarrage
  activateTab('montage');
</script>
</body>
</html>
