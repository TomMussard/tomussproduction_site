<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Merci — Tomuss Production</title>
<meta name="robots" content="noindex" />
<link rel="icon" type="image/png" href="uploads/Plan de travail 5logotest.png" />
<link rel="stylesheet" href="assets/shared.css" />
<style>
  .merci-wrap {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 60px var(--gutter);
    text-align: center;
  }
  .merci-icon {
    font-size: 60px;
    margin-bottom: 24px;
    animation: pop .5s var(--ease) forwards;
  }
  @keyframes pop { from { transform: scale(.5); opacity:0; } to { transform: scale(1); opacity:1; } }
  .merci-title {
    font-family: var(--f-display);
    font-size: clamp(64px, 12vw, 160px);
    text-transform: uppercase;
    line-height: .86;
    margin-bottom: 20px;
  }
  .merci-title em { color: var(--accent); font-style: italic; }
  .merci-sub {
    color: var(--fg-dim);
    font-size: 17px;
    line-height: 1.6;
    max-width: 480px;
    margin-bottom: 40px;
  }
  .dl-btn {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    padding: 18px 36px;
    background: var(--accent);
    color: #000;
    font-family: var(--f-mono);
    font-size: 12px;
    letter-spacing: .25em;
    text-transform: uppercase;
    text-decoration: none;
    transition: background .2s, transform .2s;
    border: none;
    cursor: pointer;
    font-size: 13px;
  }
  .dl-btn:hover { background: #40b8ff; transform: translateY(-2px); }
  .dl-btn:disabled { opacity: .5; cursor: not-allowed; }
  .merci-back {
    margin-top: 28px;
    display: block;
    font-family: var(--f-mono);
    font-size: 11px;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: var(--fg-dim);
    text-decoration: none;
    transition: color .2s;
  }
  .merci-back:hover { color: var(--accent); }
  .merci-error { color: #ef4444; font-size: 14px; margin-top: 16px; display: none; }
  .merci-loading { color: var(--fg-dim); font-family: var(--f-mono); font-size: 12px; letter-spacing: .2em; }
</style>
</head>
<body>
<div class="merci-wrap">
  <div class="merci-icon">🎉</div>
  <h1 class="merci-title">Merci<br/>pour ton<br/><em>achat.</em></h1>
  <p class="merci-sub">Ton paiement a bien été reçu. Ton téléchargement démarre dans quelques secondes.</p>

  <div id="dl-zone">
    <p class="merci-loading" id="loading">Vérification du paiement…</p>
    <a class="dl-btn" id="dl-btn" href="#" download style="display:none;">Télécharger mon pack ↓</a>
    <p class="merci-error" id="error-msg">Une erreur est survenue. Contacte-moi à tomussproduction@gmail.com en précisant ton numéro de commande.</p>
  </div>
  <a class="merci-back" href="shop.html">← Retour à la shop</a>
</div>

<script>
(async () => {
  const params  = new URLSearchParams(location.search);
  const sid     = params.get('sid');
  const p       = params.get('p');
  const loading = document.getElementById('loading');
  const dlBtn   = document.getElementById('dl-btn');
  const errMsg  = document.getElementById('error-msg');

  if (!sid) {
    loading.style.display = 'none';
    errMsg.style.display = 'block';
    return;
  }

  try {
    const res  = await fetch(`/api/verify-payment?sid=${encodeURIComponent(sid)}&p=${encodeURIComponent(p || '')}`);
    const data = await res.json();

    loading.style.display = 'none';

    if (!data.paid) {
      errMsg.style.display = 'block';
      return;
    }

    if (data.url) {
      dlBtn.href = data.url;
      dlBtn.style.display = 'inline-flex';
      // Déclenche le téléchargement automatiquement
      setTimeout(() => dlBtn.click(), 600);
    } else {
      // Produit configuré mais URL pas encore renseignée
      dlBtn.textContent = 'Lien de téléchargement bientôt disponible';
      dlBtn.href = '#';
      dlBtn.style.display = 'inline-flex';
      dlBtn.style.background = 'var(--surface)';
      dlBtn.style.color = 'var(--fg-dim)';
    }
  } catch {
    loading.style.display = 'none';
    errMsg.style.display = 'block';
  }
})();
</script>
</body>
</html>
